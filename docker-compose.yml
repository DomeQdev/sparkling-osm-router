services:
  router:
    build:
      context: .
      dockerfile: Dockerfile
    image: sparkling-osm-router:latest
    container_name: sparkling-osm-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
