[package]
name = "sparkling-osm-router-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sparkling-osm-router-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
routx = { git = "https://github.com/DomeQdev/routx" }
